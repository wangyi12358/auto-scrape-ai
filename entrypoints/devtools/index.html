<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>自动抓包 AI — DevTools</title>
	</head>
	<body>
		<h1>网络抓取</h1>
		<p class="hint">
			请打开被检查页面的「网络」面板并刷新或操作页面。已在选项中排除的静态资源会在读取响应体之前被跳过。
		</p>
		<div class="row">
			<button type="button" id="record-toggle" aria-pressed="false">
				开始录制
			</button>
		</div>
		<div class="stats" id="stats">
			<div>已完成请求：<strong id="stat-total">0</strong></div>
			<div>已跳过（过滤）：<strong id="stat-skipped">0</strong></div>
			<div>通过过滤：<strong id="stat-passed">0</strong></div>
			<div>读取响应体失败：<strong id="stat-body-fail">0</strong></div>
		</div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
